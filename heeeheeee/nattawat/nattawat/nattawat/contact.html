    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Info Styling */
        .info-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #fdfdfd;
            padding: 20px;
            border-radius: 4px;
            border-left: 4px solid #3498db;
        }

        .info-item {
            margin-bottom: 20px;
        }

        .info-item h4 {
            color: #3498db;
            margin-bottom: 5px;
        }

        .social-links a {
            color: #333;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }

        .social-links a:hover {
            color: #3498db;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side: Form -->
        <div>
            <h2>Get in Touch</h2>
            <!-- Replace 'your@email.com' with your actual email address -->
            <form action="https://formsubmit.co" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Nattawat Phaiboonphan">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="How can we help you?"></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </div>

        <!-- Right Side: Contact Details -->
        <div class="info-side">
            <h2>Contact Information</h2>
            <div class="info-item">
                <h4>Email</h4>
                <p>info@yourwebsite.com</p>
            </div>
            <div class="info-item">
                <h4>Phone</h4>
                <p>+1 (555) 000-0000</p>
            </div>
            <div class="info-item">
                <h4>Our Location</h4>
                <p>123 Business Rd, Suite 100<br>City, State, Zip</p>
            </div>
            <div class="info-item">
                <h4>Follow Us</h4>
                <div class="social-links">
                    <a href="#">Twitter</a>
                    <a href="#">LinkedIn</a>
                    <a href="#">Instagram</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
